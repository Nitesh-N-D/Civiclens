name: Source monitor

# Weekly check of every active official source; results go to source_checks for human review.
# Needs the DATABASE_URL repository secret. Without it the job exits without doing anything.
on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Skip when the database secret is not configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-lock.txt
      - if: steps.gate.outputs.run == 'true'
        run: python scripts/monitor_sources.py
