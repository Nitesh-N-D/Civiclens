# Render Blueprint for the CivicLens API (free plan), deployed at https://civiclens-api-xzm0.onrender.com. Secrets are entered in the Render dashboard, never committed.
services:
  - type: web
    name: civiclens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_ENABLE_EMBEDDINGS
        value: "false"
      - key: GEMINI_REQUESTS_PER_MINUTE
        value: "10"
      - key: GEMINI_DAILY_REQUEST_LIMIT
        value: "100"
      - key: CLIENT_REQUESTS_PER_MINUTE
        value: "5"
      - key: CLIENT_DAILY_REQUEST_LIMIT
        value: "40"
      # The deployed frontend origin (exact, no trailing slash). Add local origins only for testing.
      - key: ALLOWED_ORIGINS
        value: https://civiclens.nitesh-viva-ai.workers.dev
      # Render terminates TLS in front of the service, so X-Forwarded-For is trustworthy here.
      - key: TRUST_FORWARDED_FOR
        value: "true"
      # Optional Supabase transaction-pooler URL (see backend/.env.example). Empty = no database.
      - key: DATABASE_URL
        sync: false
      # Optional maintainer sign-in (docs/guides/ADMIN_GUIDE.md). Publishable key only, never service_role.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
